schema: ''
sql: "SELECT \r\n    f.order_id,\r\n    f.order_date,\r\n    f.order_status,\r\n \
  \   f.currency_code,\r\n    f.quantity,\r\n    f.unit_price,\r\n    f.line_total\
  \ AS revenue_eur,\r\n    f.payment_method,\r\n    p.product_name,\r\n    p.category\
  \ AS product_category,\r\n    s.store_name,\r\n    s.city AS store_city,\r\n   \
  \ s.country_code AS store_country,\r\n    c.full_name AS customer_name,\r\n    c.country_code\
  \ AS customer_country\r\nFROM analytics_marts.fct_daily_sales AS f\r\nINNER JOIN\
  \ analytics_marts.dim_products AS p ON f.product_id = p.product_id\r\nINNER JOIN\
  \ analytics_marts.dim_stores AS s ON f.store_id = s.store_id\r\nINNER JOIN analytics_marts.dim_customers\
  \ AS c ON f.customer_id = c.customer_id;"
