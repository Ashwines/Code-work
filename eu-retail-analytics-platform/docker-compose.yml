# ============================================================
# Airflow 3.3.1 Config Anchor
# ============================================================
x-airflow-common: &airflow-common
  image: olist-airflow:3.3.1
  environment: &airflow-common-env
    JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-api-server:8080/execution/"
    AIRFLOW__API_AUTH__JWT_SECRET: "retail-lakehouse-super-secret-key-change-me"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
    
    # ===== Airflow 3 Authentication (SimpleAuthManager) =====
    AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: 'True'
    
    # MinIO / Lake S3 Credentials
    AWS_ACCESS_KEY_ID: minioadmin
    AWS_SECRET_ACCESS_KEY: minioadmin
    AWS_ENDPOINT_URL: http://minio:9000
    
    # Retail Database Source Env
    SOURCE_DB_HOST: postgres
    SOURCE_DB_PORT: 5432
    SOURCE_DB_NAME: retail_source
    SOURCE_DB_USER: retail
    SOURCE_DB_PASSWORD: retail
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./logs:/opt/airflow/logs
    - ./config:/opt/airflow/config
    - ./data:/opt/airflow/data
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy
    minio:
      condition: service_healthy

services:

  postgres:
    image: postgres:16
    container_name: erp-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-retail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-retail}
      POSTGRES_DB: ${POSTGRES_DB:-retail_source}
    ports:
      - "5433:5432"   # 5433 to avoid clash with Olist Airflow Postgres on 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-retail}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: erp-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9010:9000"   # API (avoid clash with Olist 9000)
      - "9011:9001"   # Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: erp-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb local/landing --ignore-existing;
      mc mb local/raw --ignore-existing;
      mc mb local/refined --ignore-existing;
      mc mb local/marts --ignore-existing;
      echo 'MinIO buckets ready';
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: erp-clickhouse
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-retail_analytics}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"   # HTTP
      - "9009:9000"   # Native (9009 host to avoid clash)
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./infra/clickhouse/init:/docker-entrypoint-initdb.d
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  # --- Caching Layer for Superset ---
  redis:
    image: redis:7-alpine
    container_name: eu_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  # --- Hasura GraphQL Engine ---
  # --- Hasura GraphQL Engine ---
  hasura:
    image: hasura/graphql-engine:v2.48.0
    container_name: eu_hasura
    restart: unless-stopped
    ports:
      - "8085:8080"
    environment:
      # Connects to the internal container network on port 5432 using your configured credentials
      HASURA_GRAPHQL_METADATA_DATABASE_URL: postgres://${POSTGRES_USER:-retail}:${POSTGRES_PASSWORD:-retail}@postgres:5432/${POSTGRES_DB:-retail_source}
      HASURA_GRAPHQL_ENABLE_CONSOLE: "true"
      HASURA_GRAPHQL_DEV_MODE: "true"
      HASURA_GRAPHQL_ADMIN_SECRET: "adminsecret"
      HASURA_GRAPHQL_UNAUTHORIZED_ROLE: "anonymous"
    depends_on:
      postgres:
        condition: service_healthy

  # --- Apache Superset Initialization ---
  superset-init:
    image: apache/superset:latest
    container_name: eu_superset_init
    user: root
    command: >
      bash -c "
        pip install --target /app/.venv/lib/python3.10/site-packages psycopg2-binary clickhouse-connect &&
        superset db upgrade &&
        superset fab create-admin --username admin --firstname Admin --lastname User --email admin@retail.eu --password admin &&
        superset init
      "
    environment:
      SUPERSET_CONFIG_PATH: /app/superset_config.py
      SUPERSET_SECRET_KEY: "super_secret_retail_key_change_in_prod"
      SQLALCHEMY_DATABASE_URI: postgresql+psycopg2://${POSTGRES_USER:-retail}:${POSTGRES_PASSWORD:-retail}@postgres:5432/superset_metadata
    volumes:
      - ./superset_config.py:/app/superset_config.py
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # --- Apache Superset App ---
  superset:
    image: apache/superset:latest
    container_name: eu_superset
    restart: unless-stopped
    user: root
    command: >
      bash -c "
        pip install --target /app/.venv/lib/python3.10/site-packages psycopg2-binary clickhouse-connect &&
        /usr/bin/run-server.sh
      "
    ports:
      - "8088:8088"
    environment:
      SUPERSET_CONFIG_PATH: /app/superset_config.py
      SUPERSET_SECRET_KEY: "super_secret_retail_key_change_in_prod"
      SQLALCHEMY_DATABASE_URI: postgresql+psycopg2://${POSTGRES_USER:-retail}:${POSTGRES_PASSWORD:-retail}@postgres:5432/superset_metadata
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ./superset_config.py:/app/superset_config.py
    depends_on:
      superset-init:
        condition: service_completed_successfully
  # --- Synthetic Data Seeder (Phase 2) ---
  data-seeder:
    build:
      context: ./data_generator
      dockerfile: Dockerfile
    container_name: eu_data_seeder
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-retail_source}
      POSTGRES_USER: ${POSTGRES_USER:-retail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-retail}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
  # --- Airflow 3 Database Migrations ---
  airflow-init:
    <<: *airflow-common
    container_name: eu_airflow_init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        echo "Airflow 3 database migrated successfully"
    environment:
      <<: *airflow-common-env
    user: "0:0"
    restart: "no"

  # --- Airflow 3 API Server (FastAPI UI & API) ---
  airflow-api-server:
    <<: *airflow-common
    container_name: eu_airflow_api_server
    command: api-server
    ports:
      - "8082:8080"
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # --- Airflow 3 Scheduler ---
  airflow-scheduler:
    <<: *airflow-common
    container_name: eu_airflow_scheduler
    command: scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # --- Airflow 3 DAG Processor ---
  airflow-dag-processor:
    <<: *airflow-common
    container_name: eu_airflow_dag_processor
    command: dag-processor
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
  minio_data:
  clickhouse_data: